apiVersion: v1
kind: PersistentVolume
metadata:
  name: {{ .Values.mysql.pv.namePrefix }}-0
spec:
  capacity:
    storage: {{ .Values.mysql.persistence.size }}
  accessModes:
  - ReadWriteOnce
  storageClassName: {{ .Values.storageClass.name }}
  hostPath:
    path: {{ .Values.mysql.pv.basePath }}/mysql-0
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: {{ .Values.mysql.pv.namePrefix }}-1
spec:
