name: Test and Install

on:
  push:
    branches:
      - main
  workflow_dispatch:
  release:
    types: [created, published]

jobs:
  testing:
    runs-on: self-hosted
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check for repo
        run: |
          ls -a
          pwd

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
 
      - name: Putting the kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" > ~/.kube/config
          kubectl version 
          kubectl get nodes
