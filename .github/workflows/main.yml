name: Continuous Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:
  release:
    types: [created, published]

jobs:
  test:
  
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./src
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Cache Vendor Folder
        uses: actions/cache@v4
        id: cache-vendor
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}


      - name: Install Dependencies
        if: steps.cache-vendor.outputs.cache-hit != 'true'
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Run Tests
        run: php artisan test

  deploying:
    needs: test
    if: github.event_name == 'workflow_dispatch'
    runs-on: self-hosted
    steps:
      - name: image stack
        uses: Mohamed-Ahmed-Mohamed-Hussein-240102962/standalone/doc@main
        id: build-image
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          image: moopsdev/laravel-ci-cd

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Install helm
        uses: azure/setup-helm@v4

      - name: Putting the kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" > ~/.kube/config
          kubectl version 
          kubectl get nodes

      - name: applying edit
        run: |
          helm upgrade --install web ./helm \
            --namespace production \
            --create-namespace \
            --force \
            --set backend.image=moopsdev/laravel-ci-cd:${{ steps.build-image.outputs.image_tag }}
