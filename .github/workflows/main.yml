name: Cuntainous Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:
  release:
    types: [created, published]

jobs:
  testing:
    runs-on: self-hosted
    steps:
   
      - name: image stack
        uses: Mohamed-Ahmed-Mohamed-Hussein-240102962/standalone/doc@main
        id: build-image
        with:
          username: ${{secrets.DOCKER_USERNAME}}
          password: ${{secrets.DOCKER_PASSWORD}}
          image: moopsdev/laravel-ci-cd
      - name: Install kubectl
        uses: azure/setup-kubectl@v4
      - name: helm install
        uses: azure/setup-helm@v4
 
      - name: Putting the kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" > ~/.kube/config
          kubectl version 
          kubectl get nodes
      - name: applying edit
        run: |
           helm upgrade --install web ./helm \
            --namespace production \
            --create-namespace --force-conflicts \
            --set backend.image=moopsdev/laravel-ci-cd:${{ steps.build-image.outputs.image_tag }}
